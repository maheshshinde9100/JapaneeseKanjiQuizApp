<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Quiz Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container py-4">
        <!-- Header -->
        <div class="header-section mb-4">
            <h1 class="text-center mb-3">漢字 Reading Quiz</h1>
            <button id="resetBtn" class="btn btn-outline-secondary">Reset Quiz</button>
        </div>

        <!-- Score Panels -->
        <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
                <div class="score-panel onyomi-panel">
                    <h3>音読み (On'yomi)</h3>
                    <div class="score-display">
                        <span id="onyomiScore">0</span> / <span id="onyomiTotal">0</span>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="score-panel kunyomi-panel">
                    <h3>訓読み (Kun'yomi)</h3>
                    <div class="score-display">
                        <span id="kunyomiScore">0</span> / <span id="kunyomiTotal">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section mb-4">
            <div class="progress-text mb-2">
                Progress: <span id="currentKanji">0</span> / <span id="totalKanji">0</span>
            </div>
            <div class="progress">
                <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Kanji Display -->
        <div class="kanji-display mb-4">
            <div id="kanjiChar" class="kanji-character">漢</div>
        </div>

        <!-- Reading Selection Grids -->
        <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
                <div class="reading-section onyomi-section">
                    <h4 class="reading-title">Select On'yomi Readings:</h4>
                    <div id="onyomiGrid" class="reading-grid"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="reading-section kunyomi-section">
                    <h4 class="reading-title">Select Kun'yomi Readings:</h4>
                    <div id="kunyomiGrid" class="reading-grid"></div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="checkBtn" class="btn btn-primary btn-lg">Check Answers</button>
            <button id="nextBtn" class="btn btn-success btn-lg" style="display: none;">Next Kanji</button>
        </div>
    </div>

    <script src="kanji-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
